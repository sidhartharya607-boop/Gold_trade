<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Gold Bars Graphic -->
  <g transform="translate(100, 110)">
    <!-- Base Gold Bar 1 -->
    <polygon points="40,200 160,200 210,150 90,150" fill="url(#goldGrad)" opacity="0.9"/>
    <polygon points="40,200 160,200 160,230 40,230" fill="#B45309"/>
    <polygon points="160,200 210,150 210,180 160,230" fill="#92400E"/>

    <!-- Base Gold Bar 2 -->
    <polygon points="170,200 290,200 340,150 220,150" fill="url(#goldGrad)" opacity="0.95"/>
    <polygon points="170,200 290,200 290,230 170,230" fill="#B45309"/>
    <polygon points="290,200 340,150 340,180 290,230" fill="#92400E"/>

    <!-- Top Gold Bar 3 -->
    <polygon points="105,120 225,120 275,70 155,70" fill="url(#goldGrad)"/>
    <polygon points="105,120 225,120 225,150 105,150" fill="#F59E0B"/>
    <polygon points="225,120 275,70 275,100 225,150" fill="#D97706"/>
    
    <!-- Arbitrage Arrows -->
    <path d="M 28 60 L 78 60 L 58 35 M 78 60 L 58 85" fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 292 245 L 242 245 L 262 220 M 242 245 L 262 270" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">GOLD TRADE</text>
</svg>
